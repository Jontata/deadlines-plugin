name: Release plugin

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check tag version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          version="${TAG_NAME#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [ "$version" != "$manifest_version" ]; then
            echo "Tag $TAG_NAME does not match manifest version $manifest_version"
            exit 1
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "deadlines-plugin-${GITHUB_REF_NAME#v}.zip" --title "Deadlines ${GITHUB_REF_NAME#v}" --generate-notes
